name: build and publish base images

# Builds rammp-base and rammp-cuda for linux/arm64 and publishes them to GHCR.
#
# Runs on ubuntu-24.04-arm: GitHub's NATIVE arm64 hosted runners, which are free
# for public repositories. Native means no QEMU emulation. The robot's Jetson is
# deliberately NOT a self-hosted runner -- making field hardware a prerequisite
# for publishing an image is a bad trade.
#
# Uses plain `docker build` via the Makefile, the same commands you run on the
# Jetson, rather than buildx. That is deliberate: rammp-cuda is
# `FROM rammp-base`, and buildx's docker-container driver keeps its own image
# store, so a locally built rammp-base is invisible to the next buildx build --
# which then tries to pull it from Docker Hub and fails with
# "pull access denied ... insufficient_scope". Plain docker build shares the
# daemon's image store, so the FROM resolves. It also means CI and the robot
# run identical commands.
#
# What this proves: the images build, the CUDA and PyTorch stacks install and
# link, and the interface packages compile for arm64.
# What it CANNOT prove: that CUDA runs. A hosted arm64 runner has no GPU, so
# scripts/smoke-test.sh skips its GPU section here. That gap closes on the
# robot, where the same script runs those checks.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Free disk space
        # rammp-cuda carries the CUDA runtime, cuDNN and PyTorch and runs to
        # several GB. A hosted runner ships with ~14 GB free, so reclaim what
        # the preinstalled toolchains are holding before building.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Derive version
        id: version
        run: |
          # A v* tag publishes that version; anything else is an unpublished
          # build labelled by commit, so untagged pushes can never overwrite a
          # release tag in the registry.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build images
        # One invocation, not two: `cuda` depends on `base`, so make builds
        # base once rather than re-running its recipe.
        run: |
          make base cuda VERSION=${{ steps.version.outputs.version }}
          df -h /

      - name: Smoke-test images
        run: make test VERSION=${{ steps.version.outputs.version }}

      - name: Log in to GHCR
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release tags
        if: steps.version.outputs.publish == 'true'
        run: |
          make push \
            VERSION=${{ steps.version.outputs.version }} \
            REGISTRY=${{ env.REGISTRY }}/${{ github.repository_owner }}
