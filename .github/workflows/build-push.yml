name: build and publish base images

# Builds rammp-base and rammp-cuda for linux/arm64 and publishes them to GHCR.
#
# Runs on ubuntu-24.04-arm: GitHub's NATIVE arm64 hosted runners, which are free
# for public repositories. Native means no QEMU, so a build that would take
# tens of minutes under emulation takes minutes here. The robot's Jetson is
# deliberately NOT a self-hosted runner -- making field hardware a prerequisite
# for publishing an image is a bad trade.
#
# What this proves: the images build, the CUDA and PyTorch stacks install and
# link, and the interface packages compile for arm64.
# What it CANNOT prove: that CUDA runs. A hosted arm64 runner has no GPU. That
# last gap closes on the robot -- see scripts/smoke-test.sh.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Derive version
        id: version
        run: |
          # A v* tag publishes that version; anything else is an unpublished
          # build labelled by commit, so untagged pushes can never overwrite a
          # release tag in the registry.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built into the local daemon first, because rammp-cuda is FROM
      # rammp-base and needs to resolve it locally before anything is pushed.
      - name: Build rammp-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/base/Dockerfile
          platforms: linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: rammp-base:${{ steps.version.outputs.version }}
          load: true
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

      - name: Build rammp-cuda
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/cuda/Dockerfile
          platforms: linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: rammp-cuda:${{ steps.version.outputs.version }}
          load: true
          cache-from: type=gha,scope=cuda
          cache-to: type=gha,scope=cuda,mode=max

      - name: Verify images
        run: |
          set -euo pipefail
          ./scripts/smoke-test.sh "rammp-base:${{ steps.version.outputs.version }}"
          ./scripts/smoke-test.sh "rammp-cuda:${{ steps.version.outputs.version }}"

      - name: Push release tags
        if: steps.version.outputs.publish == 'true'
        env:
          V: ${{ steps.version.outputs.version }}
          NS: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}
        run: |
          set -euo pipefail
          for img in rammp-base rammp-cuda; do
            docker tag "$img:$V" "$NS/$img:$V"
            docker tag "$img:$V" "$NS/$img:humble"
            docker push "$NS/$img:$V"
            docker push "$NS/$img:humble"
          done
